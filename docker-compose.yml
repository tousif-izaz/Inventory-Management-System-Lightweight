version: '3.8'

services:
  # Backend Go API with SQLite
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ims-backend
    environment:
      DB_PATH: server/data/inventory.db
      JWT_KEY: ultra-super-secret
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
